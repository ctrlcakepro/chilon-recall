# DeepSeek Harness bundle for the existing Chilon Recall stdio MCP server.
# Set CHILON_RECALL_ROOT to the absolute source/package directory before booting
# DSH; the bridge runs the CLI with that directory as its working directory.
- insert:
    - id: chilon-recall-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chilon-recall
        transport: stdio
        command: node
        args: ['scripts/cli.mjs', 'mcp']
        cwd: !!js process.env.CHILON_RECALL_ROOT || process.cwd()
        env: !!js "Object.fromEntries(['RAG_MANAGER_CONFIG', 'RAG_API_KEY', 'RAG_RERANK_API_KEY', 'CHILON_RECALL_HOME', 'CHILON_RECALL_PYTHON'].filter((name) => process.env[name]).map((name) => [name, process.env[name]]))"
        failOnStartupError: true
