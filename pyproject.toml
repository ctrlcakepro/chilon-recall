[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chilon-recall-engine"
version = "0.1.3"
description = "FAISS indexing and retrieval engine for Chilon Recall"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ctrlcakepro" }]
dependencies = [
  "faiss-cpu>=1.8,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3"
]

[project.scripts]
chilon-recall-engine = "chilon_recall.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
